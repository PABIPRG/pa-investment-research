# DeepSeek Harness 插件补丁清单：加载 dsh-trading-core 插件
# 用法（由 start_all.bat 自动生成临时 yml 并传入 --patch）：
#   npx @deepseek-ai/dsh web --patch <generated-cordis.yml>
#
# 注意：{{ROOT}} 为占位符，start_all.bat 启动时会替换为本机绝对路径
#       （dsh 在 %TEMP% 下运行，loader 需要 file:// 绝对 URL，不能用相对路径）
- insert:
    - id: stock-analysis
      # Windows 下 cordis loader 只接受 file:// URL（裸 C:/ 路径会被当作 URL scheme）
      # 正斜杠 + 中文 URL 编码由 start_all.bat 生成时处理
      name: '{{PLUGIN_URL}}'
      config:
        # 适配器服务地址（S1-S2 起在 8000 端口）
        adapterBaseUrl: 'http://127.0.0.1:8000'
