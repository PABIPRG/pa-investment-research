# DeepSeek Harness 插件补丁清单：加载 market-watch 盘中盯盘插件
# 用法：
#   npx @deepseek-ai/dsh web --patch C:/Users/徐诗靖/Desktop/navigate/pa-investment-research/backend/market-watch/dsh-plugin/cordis.yml --port 3081
- insert:
    - id: market-watch
      # Windows 下 cordis loader 只接受 file:// URL（裸 C:/ 路径会被当作 URL scheme）
      name: 'file:///C:/Users/%E5%BE%90%E8%AF%97%E9%9D%96/Desktop/navigate/pa-investment-research/backend/market-watch/dsh-plugin/src/index.ts'
      config:
        # 盯盘适配器服务地址（market-watch 起在 8100 端口）
        adapterBaseUrl: 'http://127.0.0.1:8100'
