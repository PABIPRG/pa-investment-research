# Electron reuses the Web product composition while replacing every browser
# carrier. The renderer loads local built files and reaches the Host through
# the application-owned IPC service below; no HTTP listener is mounted.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'
    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

- id: connection
  disabled: true

- id: modules
  config:
    additionalPackages:
      - '@deepseek-ai/dsh-client-connection'

- insert:
    - id: electron-connection
      name: '@deepseek-ai/dsh-electron'
