name: Investment engine smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-engine-smoke:
    name: managed engines / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'

      - name: Install frontend (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Install Python engines (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m venv ../backend/dsh-trading-core/env
          ../backend/dsh-trading-core/env/bin/python -m pip install -r ../backend/dsh-trading-core/requirements.txt
          python -m venv ../backend/market-watch/env
          ../backend/market-watch/env/bin/python -m pip install -r ../backend/market-watch/requirements.txt
          python -m venv ../backend/industry-chain/env
          ../backend/industry-chain/env/bin/python -m pip install -r ../backend/industry-chain/requirements.txt

      - name: Install Python engines (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv ..\backend\dsh-trading-core\env
          ..\backend\dsh-trading-core\env\Scripts\python.exe -m pip install -r ..\backend\dsh-trading-core\requirements.txt
          python -m venv ..\backend\market-watch\env
          ..\backend\market-watch\env\Scripts\python.exe -m pip install -r ..\backend\market-watch\requirements.txt
          python -m venv ..\backend\industry-chain\env
          ..\backend\industry-chain\env\Scripts\python.exe -m pip install -r ..\backend\industry-chain\requirements.txt

      - name: Boot and dispose managed engines
        env:
          ADAPTER_RUNNER: engine
          BRIEF_SCHEDULE_ENABLED: 'false'
          MW_SCHEDULE_ENABLED: 'false'
          DSH_INVESTMENT_ENGINE_SMOKE: '1'
        run: >-
          node --input-type=module -e
          "import { startVitest } from 'vitest/node';
          const v = await startVitest('test', [], {
          run: true, config: 'vitest.e2e.config.ts',
          include: ['packages/investment-research/python-runtime/tests/managed-engine.smoke.ts'],
          retry: 0 }); await v.close()"
