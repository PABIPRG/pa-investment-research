name: pa-investment-research

services:
  investment:
    image: ${DSH_IMAGE:-pa-investment-research:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DSH_HOME: /var/lib/dsh
      DSH_DEPLOYMENT_SURFACE: cloud-web
      DSH_WEB_AUTH: required
      DSH_WEB_INSECURE_COOKIES: "0"
      DSH_WEB_ADMIN_USERNAME: ${DSH_WEB_ADMIN_USERNAME:?set DSH_WEB_ADMIN_USERNAME}
      DSH_WEB_ADMIN_PASSWORD_HASH_SOURCE_FILE: /run/secrets/web-admin-password-hash
      DSH_WEB_TRUSTED_HOSTS: ${DSH_WEB_TRUSTED_HOSTS:?set DSH_WEB_TRUSTED_HOSTS}
      DSH_WEB_TRUSTED_PROXIES: ${DSH_WEB_TRUSTED_PROXIES:?set DSH_WEB_TRUSTED_PROXIES}
      PORT: ${PORT:-3080}
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - 127.0.0.1:${PORT:-3080}:${PORT:-3080}
    volumes:
      - dsh-data:/var/lib/dsh
    secrets:
      - web-admin-password-hash
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1777
      - /run/dsh:rw,noexec,nosuid,nodev,size=1m,uid=10001,gid=10001,mode=0700
    healthcheck:
      test: [CMD, node, /opt/container/investment-healthcheck.mjs]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

secrets:
  web-admin-password-hash:
    file: ${DSH_WEB_ADMIN_PASSWORD_HASH_FILE:?set DSH_WEB_ADMIN_PASSWORD_HASH_FILE}

volumes:
  dsh-data: {}
