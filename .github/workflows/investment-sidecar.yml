name: Investment packaged sidecar

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-smoke:
    name: ${{ matrix.target }} packaged smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify native target
        shell: bash
        run: test "$(node -p "process.platform+'-'+process.arch")" = "${{ matrix.target }}"

      - name: Install frontend
        run: pnpm install --frozen-lockfile

      - name: Verify shared application version
        id: app_version
        shell: bash
        run: |
          pnpm run constraints
          app_version=$(node -p "require('./package.json').version")
          echo "value=$app_version" >> "$GITHUB_OUTPUT"

      - name: Build test application and sidecar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ulimit -n 10240
          pnpm run make:electron

      - name: Build test application and sidecar (Windows)
        if: runner.os == 'Windows'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run make:electron

      - name: Smoke packaged sidecar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          descriptor=$(find apps/electron/out -path '*/Resources/investment-python/runtime.json' -print -quit)
          test -n "$descriptor"
          app="${descriptor%%/Contents/Resources/*}"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          node scripts/smoke-investment-python-sidecar.ts --root "${descriptor%/runtime.json}"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Smoke packaged sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $descriptor = Get-ChildItem apps/electron/out -Filter runtime.json -Recurse |
            Where-Object { $_.FullName -match 'resources[\\/]investment-python[\\/]runtime.json$' } |
            Select-Object -First 1
          if ($null -eq $descriptor) { throw 'packaged investment sidecar not found' }
          node scripts/smoke-investment-python-sidecar.ts --root $descriptor.Directory.FullName

      - name: Upload downloadable test package
        uses: actions/upload-artifact@v4
        with:
          name: investment-agent-${{ steps.app_version.outputs.value }}-${{ matrix.target }}
          path: frontend/apps/electron/out/make/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
