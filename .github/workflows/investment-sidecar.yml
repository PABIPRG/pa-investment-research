name: 桌面版打包验证

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: Investment packaged sidecar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  shared-build:
    name: portable desktop build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    outputs:
      artifact-id: ${{ steps.compiled.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        run: pnpm install --frozen-lockfile
      - name: Test portable build boundary
        run: >-
          pnpm exec vitest run
          scripts/investment-desktop-build-artifact.spec.ts
          scripts/investment-sidecar-file-hashes.spec.ts
      - name: Compile platform-independent desktop outputs once
        run: pnpm run build
      - name: Capture compiled outputs for this checkout
        run: node scripts/investment-desktop-build-artifact.ts capture "${{ runner.temp }}/desktop-build" "${{ github.sha }}"
      - name: Transfer compiled outputs to native runners
        id: compiled
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-build/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  package-smoke:
    name: ${{ matrix.target }} packaged smoke
    needs: shared-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Download caches remain the fallback when the assembled desktop cache is absent or rejected.
      - name: Cache verified Python archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/investment-downloads/python
          key: investment-python-runtime-v1-${{ matrix.target }}-${{ hashFiles('frontend/config/investment-python-runtime-lock.json') }}

      - name: Cache pip and Electron downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/investment-downloads/pip
            ${{ runner.temp }}/investment-downloads/electron
          key: investment-package-downloads-v1-${{ matrix.target }}-${{ hashFiles('frontend/config/investment-python-runtime-lock.json', 'frontend/pnpm-lock.yaml') }}

      - name: Verify native target
        shell: bash
        run: test "$(node -p "process.platform+'-'+process.arch")" = "${{ matrix.target }}"

      - name: Install frontend
        run: pnpm install --frozen-lockfile

      - name: Fingerprint native sidecar inputs
        id: desktop_cache
        run: node scripts/investment-desktop-sidecar-cache.ts fingerprint "${{ matrix.target }}"

      # GNU tar must retain POSIX modes; Windows permissions are checked by the
      # real tar roundtrip in the native regression suite below.
      - name: Verify macOS cache archive tool
        if: runner.os == 'macOS'
        shell: bash
        run: gtar --version | grep 'GNU tar'

      - name: Restore assembled desktop sidecar
        id: restored_sidecar
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        env:
          TAR_OPTIONS: --same-permissions
        with:
          path: ${{ runner.temp }}/investment-desktop-sidecar
          key: ${{ steps.desktop_cache.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.desktop_cache.outputs.prefix }}

      - name: Test backend package privacy gates
        env:
          DSH_TEST_DESKTOP_CACHE_TAR: '1'
          DSH_DESKTOP_SMOKE_TEST_ROOT: ${{ runner.temp }}/desktop-smoke-tests
        run: >-
          pnpm exec vitest run
          scripts/investment-desktop-build-artifact.spec.ts
          scripts/investment-sidecar-file-hashes.spec.ts
          scripts/investment-desktop-sidecar-cache.spec.ts
          scripts/investment-backend-package-policy.spec.ts
          scripts/build-investment-python-sidecar.spec.ts
          scripts/smoke-investment-python-sidecar.spec.ts
          scripts/smoke-investment-desktop.spec.ts
          apps/electron/tests/packaging.spec.ts
          apps/electron/tests/portable-package.spec.ts
          apps/electron/tests/entry-failure.spec.ts
          apps/electron/tests/main-startup.spec.ts
          apps/electron/tests/restart.spec.ts

      - name: Upload desktop acceptance test failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-acceptance-test-failures-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-smoke-tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify shared application version
        id: app_version
        shell: bash
        run: |
          pnpm run constraints
          app_version=$(node -p "require('./package.json').version")
          echo "value=$app_version" >> "$GITHUB_OUTPUT"

      - name: Record commit identity
        id: commit
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The immutable artifact ID comes from this run, never a branch cache or
      # another successful run. Restore only after native dependency installation.
      - name: Download this run's compiled outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.shared-build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/desktop-build

      - name: Verify and restore portable desktop build
        run: node scripts/investment-desktop-build-artifact.ts restore "${{ runner.temp }}/desktop-build" "${{ github.sha }}"

      - name: Build test application and sidecar (macOS)
        env:
          INVESTMENT_DESKTOP_SIDECAR_CACHE: ${{ runner.temp }}/investment-desktop-sidecar
          INVESTMENT_PYTHON_DOWNLOAD_CACHE: ${{ runner.temp }}/investment-downloads/python
          PIP_CACHE_DIR: ${{ runner.temp }}/investment-downloads/pip
          ELECTRON_CACHE: ${{ runner.temp }}/investment-downloads/electron
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ulimit -n 10240
          pnpm exec tsx apps/electron/src/packaging.ts make

      - name: Build test application and sidecar (Windows)
        env:
          INVESTMENT_DESKTOP_SIDECAR_CACHE: ${{ runner.temp }}/investment-desktop-sidecar
          INVESTMENT_PYTHON_DOWNLOAD_CACHE: ${{ runner.temp }}/investment-downloads/python
          PIP_CACHE_DIR: ${{ runner.temp }}/investment-downloads/pip
          ELECTRON_CACHE: ${{ runner.temp }}/investment-downloads/electron
        if: runner.os == 'Windows'
        run: pnpm exec tsx apps/electron/src/packaging.ts make

      - name: Verify packaged application icon (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          descriptor=$(find apps/electron/out -path '*/Resources/investment-python/runtime.json' -print -quit)
          test -n "$descriptor"
          app="${descriptor%%/Contents/Resources/*}"
          icon_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")
          test -n "$icon_name"
          cmp apps/electron/assets/app-icon.icns "$app/Contents/Resources/$icon_name"

      - name: Verify packaged application icon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $descriptor = Get-ChildItem apps/electron/out -Filter runtime.json -Recurse |
            Where-Object { $_.FullName -match 'resources[\\/]investment-python[\\/]runtime.json$' } |
            Select-Object -First 1
          if ($null -eq $descriptor) { throw 'packaged investment sidecar not found' }
          $packageRoot = $descriptor.Directory.Parent.Parent
          $executable = Get-ChildItem $packageRoot.FullName -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $executable) { throw 'packaged Electron executable not found' }
          Add-Type -AssemblyName System.Drawing.Common
          $expectedIcon = [System.Drawing.Icon]::new((Resolve-Path 'apps/electron/assets/app-icon.ico').Path, 32, 32)
          $actualIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($executable.FullName)
          if ($null -eq $actualIcon) { throw 'packaged Electron executable has no associated icon' }
          $expectedBitmap = $expectedIcon.ToBitmap()
          $actualBitmap = $actualIcon.ToBitmap()
          try {
            if ($expectedBitmap.Width -ne $actualBitmap.Width -or $expectedBitmap.Height -ne $actualBitmap.Height) {
              throw 'packaged Electron icon has an unexpected size'
            }
            for ($x = 0; $x -lt $expectedBitmap.Width; $x += 1) {
              for ($y = 0; $y -lt $expectedBitmap.Height; $y += 1) {
                if ($expectedBitmap.GetPixel($x, $y).ToArgb() -ne $actualBitmap.GetPixel($x, $y).ToArgb()) {
                  throw "packaged Electron icon differs at $x,$y"
                }
              }
            }
          } finally {
            $expectedBitmap.Dispose()
            $actualBitmap.Dispose()
            $expectedIcon.Dispose()
            $actualIcon.Dispose()
          }

      - name: Smoke packaged sidecar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          descriptor=$(find apps/electron/out -path '*/Resources/investment-python/runtime.json' -print -quit)
          test -n "$descriptor"
          app="${descriptor%%/Contents/Resources/*}"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          node scripts/smoke-investment-python-sidecar.ts --root "${descriptor%/runtime.json}"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Smoke packaged sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $descriptor = Get-ChildItem apps/electron/out -Filter runtime.json -Recurse |
            Where-Object { $_.FullName -match 'resources[\\/]investment-python[\\/]runtime.json$' } |
            Select-Object -First 1
          if ($null -eq $descriptor) { throw 'packaged investment sidecar not found' }
          node scripts/smoke-investment-python-sidecar.ts --root $descriptor.Directory.FullName

      - name: Verify release asset staging
        run: >-
          node scripts/investment-release.ts stage
          --version "${{ steps.app_version.outputs.value }}"
          --target "${{ matrix.target }}"
          --source-root apps/electron/out/make
          --destination-root release-assets

      - name: Smoke final desktop ZIP
        timeout-minutes: 25
        run: >-
          node scripts/smoke-investment-desktop.ts
          --zip-root release-assets
          --report-root "${{ runner.temp }}/desktop-smoke"

      - name: Upload desktop startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-startup-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/desktop-smoke/*.json
            ${{ runner.temp }}/desktop-smoke/*.png
            ${{ runner.temp }}/desktop-smoke/*.log
            ${{ runner.temp }}/desktop-smoke/logs/startup.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload downloadable test package
        uses: actions/upload-artifact@v4
        with:
          name: investment-agent-${{ steps.app_version.outputs.value }}-${{ steps.commit.outputs.short_sha }}-${{ matrix.target }}
          path: frontend/release-assets/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # Each target has its own producer key. Only successful mainline builds
      # publish that target's pre-signing source, after all its final ZIP checks.
      - name: Revalidate unsigned cache source after final package acceptance
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.INVESTMENT_DESKTOP_SIDECAR_BUILT == 'true'
        run: >-
          node scripts/investment-desktop-sidecar-cache.ts validate
          "${{ matrix.target }}" "${{ runner.temp }}/investment-desktop-sidecar"

      - name: Save accepted mainline desktop sidecar
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.INVESTMENT_DESKTOP_SIDECAR_BUILT == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/investment-desktop-sidecar
          key: ${{ steps.desktop_cache.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
