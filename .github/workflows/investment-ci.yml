name: Investment CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  startup-typecheck:
    name: startup typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Validate GitHub Actions workflows
        working-directory: .
        env:
          GOBIN: ${{ runner.temp }}/actionlint-bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$GOBIN/actionlint" -shellcheck= -pyflakes= .github/workflows/investment-ci.yml .github/workflows/investment-container.yml .github/workflows/investment-release.yml .github/workflows/investment-sidecar.yml

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Test release workflow guards
        run: pnpm exec vitest run scripts/investment-release.spec.ts

      - name: Type-check startup graph
        run: pnpm run typecheck:startup

  source-runtime:
    name: source runtime / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run investment runtime matrix
        env:
          DSH_INVESTMENT_TEST_PYTHON: python
        run: pnpm run test:investment-runtime:matrix
